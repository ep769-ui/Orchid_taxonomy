name: Build, test and publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the app
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Build the complete app and data
        run: python scripts/10_export_web.py
      - name: Test reference imports and batch reports
        run: node --test tests/test_reference_lists.mjs tests/test_web_report.mjs
      - name: Test consolidation and corrected metadata
        run: python tests/test_consolidation.py
      - name: Package the web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the app
        id: deployment
        uses: actions/deploy-pages@v4
